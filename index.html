<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="EbookStore - Biblioteca Digital. Descubra e-books focados em estudos da Bíblia, teologia e doutrinas cristãs por Fabio Russo." />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="EbookStore - Biblioteca Digital" />
    <meta property="og:description" content="Descubra e-books focados em estudos da Bíblia, teologia e doutrinas cristãs." />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EbookStore - Biblioteca Digital" />
    <meta name="twitter:description" content="Descubra e-books focados em estudos da Bíblia, teologia e doutrinas cristãs." />
    
    <title>EbookStore - Biblioteca Digital</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  
    <script>
      // Segurança Antifraude
      document.addEventListener('contextmenu', event => event.preventDefault());
      document.addEventListener('keydown', function (event) {
        if (event.keyCode === 123) { // F12
          event.preventDefault();
        }
        if (event.ctrlKey && event.shiftKey && (event.keyCode === 73 || event.keyCode === 74 || event.keyCode === 67)) { // Ctrl+Shift+I/J/C
          event.preventDefault();
        }
        if (event.ctrlKey && event.keyCode === 85) { // Ctrl+U
          event.preventDefault();
        }
      });
    </script>
  </body>

</html>
